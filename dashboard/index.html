<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Риск-сводка портфеля</title>
  <script src="https://cdn.jsdelivr.net/npm/vega@5.30.0/build/vega.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5.21.0/build/vega-lite.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.26.0/build/vega-embed.min.js"></script>
  <style>
    :root {
      --surface: #fcfcfb;
      --text-primary: #0b0b0b;
      --text-secondary: #52514e;
      --rule: #e4e3de;
    }
    body {
      margin: 0;
      background: var(--surface);
      color: var(--text-primary);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 1240px; margin: 0 auto; padding: 24px 16px 48px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    h2 { font-size: 15px; margin: 0 0 12px; font-weight: 600; }
    .sub { color: var(--text-secondary); font-size: 13px; margin: 0 0 20px; }
    section { border-top: 1px solid var(--rule); padding: 20px 0 8px; overflow-x: auto; }
    .error { color: #d03b3b; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>Риск-сводка кредитного портфеля</h1>
    <p class="sub" id="subtitle">Синтетический портфель. Суммы в тенге по курсу на дату среза, без списанных кредитов.</p>
    <section><div id="kpi"></div></section>
    <section><h2>Динамика</h2><div id="dynamics"></div></section>
    <section><h2>По отраслям</h2><div id="by_sector"></div></section>
    <section><h2>По программам</h2><div id="by_program"></div></section>
    <section><h2>Топ-10 групп связанных заёмщиков</h2><div id="top_groups"></div></section>
  </main>
  <script>
    // Русская запись чисел для format() в спеках: запятая в дробях, неразрывный пробел в тысячах.
    const formatLocale = {decimal: ",", thousands: " ", grouping: [3], currency: ["", " ₸"], minus: "−"};
    const config = {
      background: "#fcfcfb",
      font: "system-ui, -apple-system, Segoe UI, Roboto, sans-serif",
      view: {stroke: null},
      axis: {
        labelColor: "#52514e", titleColor: "#52514e", labelFontSize: 11, titleFontSize: 11,
        titleFontWeight: "normal", gridColor: "#ebeae6", domainColor: "#c9c8c2", tickColor: "#c9c8c2"
      },
      legend: {orient: "top", labelColor: "#52514e", labelFontSize: 11, symbolSize: 80},
      title: {anchor: "start", fontSize: 13, fontWeight: 600, color: "#0b0b0b", offset: 12}
    };
    const options = {actions: false, renderer: "svg", formatLocale, config};

    for (const id of ["kpi", "dynamics", "by_sector", "by_program", "top_groups"]) {
      vegaEmbed("#" + id, `specs/${id}.vl.json`, options).catch((err) => {
        const box = document.getElementById(id);
        box.className = "error";
        box.textContent = "График не построен: " + err.message;
        console.error(id, err);
      });
    }

    fetch("data/summary.json").then((r) => r.json()).then((rows) => {
      const dates = rows.map((r) => r.report_date.split("-").reverse().join(".")).join(" и ");
      document.getElementById("subtitle").textContent =
        `Синтетический портфель, срезы ${dates}. Суммы в тенге по курсу на дату среза, без списанных кредитов.`;
    }).catch(() => {});
  </script>
</body>
</html>
